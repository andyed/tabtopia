<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabtopia</title>
    <!-- Self-hosted Barlow Condensed (was render-blocking Google Fonts). -->
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="popup_styles.css">
    <link rel="stylesheet" href="popup_identity.css">
</head>
<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="logo" role="button" tabindex="0" title="Open tabtopia">Tabtopia</div>
            <div class="header-controls">
                <div class="search-container">
                    <input type="text" id="popupSearch" class="search-input" placeholder="Search tabs...">
                </div>
                <button id="openSettings" class="settings-button" type="button" aria-label="Open Tabtopia settings" title="Settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Zm8.1 4.98v-2.46l-2.17-.78a6.2 6.2 0 0 0-.63-1.51l.98-2.09-1.74-1.74-2.08.99a6.2 6.2 0 0 0-1.52-.63L12.16 2.8H9.7l-.78 2.17a6.2 6.2 0 0 0-1.51.63l-2.09-.98-1.74 1.74.99 2.08a6.2 6.2 0 0 0-.63 1.52l-2.17.78v2.46l2.17.78c.15.53.36 1.04.63 1.52l-.99 2.08 1.74 1.74 2.09-.98c.47.27.98.48 1.51.63l.78 2.17h2.46l.78-2.17a6.2 6.2 0 0 0 1.52-.63l2.08.99 1.74-1.74-.98-2.09c.27-.47.48-.98.63-1.51l2.17-.78Z"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <div class="status-bar">
            <span id="tabCount" class="status-item">0 tabs</span>
            <span id="windowCount" class="status-item">0 windows</span>
        </div>
        
        <div id="popup-treemap" class="popup-treemap"></div>
        <div id="tooltip" class="tooltip"></div>
    </div>
    
    <script src="crash-suppression.js"></script>
    <script src="../lib/d3.min.js"></script>
    <script src="popup_script.js" type="module"></script>
</body>
</html>
